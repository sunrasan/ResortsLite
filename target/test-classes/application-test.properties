# Test profile configuration — uses H2 in-memory database
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=false

# Use H2 schema init
spring.sql.init.mode=always
spring.sql.init.platform=h2
spring.sql.init.schema-locations=classpath:schema.sql

# Disable Spring Boot banner in tests
spring.main.banner-mode=off

# Logging level
logging.level.root=WARN
logging.level.com.demo.resortslite=INFO

# App properties for tests
app.inventory.endpoint=http://localhost:8081/rooms
app.payment.endpoint=http://localhost:9090/charge
app.report.base-path=${java.io.tmpdir}/test-reports/
SERVER_PORT=8080
