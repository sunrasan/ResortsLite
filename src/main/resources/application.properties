# ResortsLite - Application Configuration
spring.application.name=ResortsLite

# Server port — externalise via SERVER_PORT env var for ECS/EKS dynamic assignment
server.port=${SERVER_PORT:8080}

# ---------------------------------------------------------------------------
# PostgreSQL DataSource Configuration
# Migrated from H2 in-memory / MySQL to PostgreSQL 16
# Credentials and host are externalised to environment variables.
# For production, inject via AWS Parameter Store or Secrets Manager.
# ---------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/resortdb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---------------------------------------------------------------------------
# Connection Pool Settings (HikariCP — Spring Boot default)
# ---------------------------------------------------------------------------
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:2}
spring.datasource.hikari.connection-timeout=${DB_CONN_TIMEOUT:30000}
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-test-query=SELECT 1

# ---------------------------------------------------------------------------
# Spring JDBC / JPA Settings
# ---------------------------------------------------------------------------
# Initialise schema on startup (set to 'never' in production)
spring.sql.init.mode=${SQL_INIT_MODE:always}
spring.sql.init.platform=postgresql

# ---------------------------------------------------------------------------
# H2 Console — disabled when targeting PostgreSQL
# ---------------------------------------------------------------------------
spring.h2.console.enabled=false

# ---------------------------------------------------------------------------
# External Service Endpoints — externalised to environment variables
# Replace hardcoded internal hostnames with configurable values
# ---------------------------------------------------------------------------
app.payment.endpoint=${PAYMENT_ENDPOINT:http://payment-svc.internal:9090/charge}
app.inventory.endpoint=${INVENTORY_ENDPOINT:http://inventory-svc.internal:8081/rooms}
app.notification.endpoint=${NOTIFICATION_ENDPOINT:http://notify.internal:7070/send}
