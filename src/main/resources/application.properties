# ResortsLite - Application Configuration
spring.application.name=ResortsLite

# Server port — override via SERVER_PORT environment variable for cloud deployments (ECS/EKS)
server.port=${SERVER_PORT:8080}

# -----------------------------------------------------------------------
# PostgreSQL 16 DataSource Configuration
# Issue fix: Migrated from H2 in-memory / MySQL to PostgreSQL 16.
# All connection parameters are externalised to environment variables.
# Set the following environment variables (or AWS Parameter Store / Secrets Manager):
#   DB_HOST     — PostgreSQL host (e.g., my-db.cluster.us-east-1.rds.amazonaws.com)
#   DB_PORT     — PostgreSQL port (default: 5432)
#   DB_NAME     — Database name
#   DB_USER     — Database username
#   DB_PASSWORD — Database password (use Secrets Manager in production)
# -----------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:resortdb}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool settings (HikariCP — Spring Boot default)
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:2}
spring.datasource.hikari.connection-timeout=${DB_CONN_TIMEOUT:30000}
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA / Hibernate settings for PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# -----------------------------------------------------------------------
# H2 console disabled in PostgreSQL mode (kept for local dev profile only)
# -----------------------------------------------------------------------
spring.h2.console.enabled=false

# -----------------------------------------------------------------------
# External service endpoints — externalised to environment variables.
# Issue fix: Hardcoded internal service endpoints replaced with env-var references.
# Set the following environment variables for cloud deployment:
#   PAYMENT_ENDPOINT      — Payment service URL
#   INVENTORY_ENDPOINT    — Inventory service URL
#   NOTIFICATION_ENDPOINT — Notification service URL
# -----------------------------------------------------------------------
app.payment.endpoint=${PAYMENT_ENDPOINT:https://payment-svc.internal/charge}
app.inventory.endpoint=${INVENTORY_ENDPOINT:https://inventory-svc.internal/rooms}
app.notification.endpoint=${NOTIFICATION_ENDPOINT:https://notify.internal/send}
